name: Release

# Builds the desktop app for macOS (Apple silicon + Intel), Windows and Linux
# and attaches the installers to a GitHub Release.
# Start it by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
# or from the Actions tab (Run workflow) with a tag name.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_targets: wasm32-unknown-unknown
          - platform: ubuntu-22.04
            args: ""
            rust_targets: wasm32-unknown-unknown
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages for the webview
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Work Office ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            Download the installer for your computer:

            - **macOS** (Apple silicon and Intel): `Work.Office_*_universal.dmg`
            - **Windows**: `Work.Office_*_x64-setup.exe` (or the `.msi`)
            - **Linux**: `.AppImage` (any distribution), `.deb` (Ubuntu/Debian) or `.rpm` (Fedora)

            The app isn't signed by Apple or Microsoft yet. On macOS, if it says the app is damaged
            or can't be checked, run `xattr -cr "/Applications/Work Office.app"` once, or right-click → Open.
            On Windows, choose More info → Run anyway. See the README's Install section.
          releaseDraft: false
          prerelease: false
